services:
  api: 
    build: ./api
    ports: 
      - "${HONO_PORT}:${HONO_PORT}"
    environment:
      - HONO_HOST=${HONO_HOST}
      - HONO_PORT=${HONO_PORT}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./api/sqlite.db:/app/sqlite.db
      - ${VIDEO_DIR}:/app/videos
    depends_on:
      bullmq:
      watcher:
      redis:
        condition: service_healthy
      nginx:
        condition: service_healthy
    command: node dist/index.js

  bullmq:
    build: ./api
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
      - nginx
    volumes:
      - ${VIDEO_DIR}:/app/videos
    command: node dist/bullmq/worker.js

  watcher:
    build: ./api
    environment:
      - VIDEO_DIR=/app/videos
    depends_on:
      - nginx
    volumes:
      - ./api/sqlite.db:/app/sqlite.db
      - ${VIDEO_DIR}:/app/videos
    command: node dist/watcher/video-watcher.js

  redis:
    image: redis:alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10m
      timeout: 10s
      retries: 5
      start_period: 30s

  nginx:
    build: 
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - 6767:80
    volumes:
      - ${VIDEO_DIR}:/app/videos

volumes:
  redis-data: